name: Keep Streamlit Awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          curl -fsSL --retry 3 --retry-delay 10 \
            -A "Mozilla/5.0 (KeepAlive Bot)" \
            "https://asierdorronsoro.streamlit.app/" \
            -o /dev/null
          echo "Ping OK"
