name: Keep Streamlit Awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -A "Mozilla/5.0 (KeepAlive Bot)" \
            --max-time 30 \
            "https://asierdorronsoro.streamlit.app/")
          echo "HTTP status: $HTTP_CODE"
          if [[ "$HTTP_CODE" =~ ^[23] ]]; then
            echo "Ping OK"
          else
            echo "Ping failed"
            exit 1
          fi
